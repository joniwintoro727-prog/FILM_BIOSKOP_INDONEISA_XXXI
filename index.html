<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>XINEMA INDO</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f0f0f;
      color: white;
    }
    header {
      background: #e50914;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      padding: 15px;
    }
    .card {
      background: #1c1c1c;
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
    }
    .card img {
      width: 100%;
    }
    .card h3 {
      font-size: 14px;
      padding: 8px;
    }
    .card a {
      display: block;
      background: #e50914;
      color: white;
      text-decoration: none;
      padding: 8px;
      margin: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<header>🎬 XINEMA INDO</header>

<div class="container">
  <div class="card">
    <img src="https://via.placeholder.com/300x450">
    <h3>Film Horor</h3>
    <a href="#">Nonton</a>
  </div>
</div>

</body>
</html>
