<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XINEMA INDO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter;background:#0f0f0f;color:#fff}

/* NAVBAR */
header{
position:fixed;top:0;width:100%;
background:rgba(0,0,0,.85);
padding:15px 30px;
display:flex;justify-content:space-between;
z-index:999
}
header h1{color:#e50914;font-weight:800}
input{
background:#222;border:none;color:#fff;
padding:8px 12px;border-radius:6px;
outline:none
}

/* HERO */
.hero{
height:90vh;
background:
linear-gradient(to top,#0f0f0f,rgba(0,0,0,.4)),
url('https://picsum.photos/1200/700');
background-size:cover;
display:flex;align-items:center;
padding:80px 40px
}
.hero h2{font-size:42px;margin-bottom:15px}
.hero p{color:#ccc;max-width:500px}

/* SECTION */
section{padding:40px}
.row{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:16px
}
.card{
background:#1c1c1c;
border-radius:8px;
overflow:hidden;
cursor:pointer;
transition:.3s
}
.card:hover{transform:scale(1.05)}
.card img{width:100%;height:240px;object-fit:cover}
.card h4{padding:10px;text-align:center;font-size:14px}

/* MODAL */
.modal{
display:none;
position:fixed;top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.8);
align-items:center;justify-content:center;
z-index:1000
}
.modal iframe{
width:90%;height:300px;max-width:600px
}
.close{
position:absolute;top:20px;right:30px;
font-size:30px;cursor:pointer
}

footer{text-align:center;padding:30px;color:#777}
</style>
</head>

<body>

<header>
<h1>XINEMA</h1>
<input type="text" placeholder="Search film..." onkeyup="searchFilm(this.value)">
</header>

<div class="hero">
<div>
<h2>Film Bioskop & Horor</h2>
<p>Nonton trailer film terbaru dengan tampilan ala Netflix. Gratis & ringan.</p>
</div>
</div>

<section>
<h3>Trending Now</h3>
<div class="row" id="filmList">

<div class="card" onclick="playTrailer('dQw4w9WgXcQ')">
<img src="https://picsum.photos/300/400?1">
<h4>Film Horor 1</h4>
</div>

<div class="card" onclick="playTrailer('9bZkp7q19f0')">
<img src="https://picsum.photos/300/400?2">
<h4>Film Horor 2</h4>
</div>

<div class="card" onclick="playTrailer('l482T0yNkeo')">
<img src="https://picsum.photos/300/400?3">
<h4>Film Action</h4>
</div>

</div>
</section>

<footer>© 2026 XINEMA INDO</footer>

<!-- MODAL -->
<div class="modal" id="modal">
<span class="close" onclick="closeModal()">✖</span>
<iframe id="trailer" src="" allowfullscreen></iframe>
</div>

<script>
function playTrailer(id){
document.getElementById('modal').style.display='flex';
document.getElementById('trailer').src=
'https://www.youtube.com/embed/'+id;
}
function closeModal(){
document.getElementById('modal').style.display='none';
document.getElementById('trailer').src='';
}
function searchFilm(q){
q=q.toLowerCase();
document.querySelectorAll('.card').forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>

</body>
</html>
